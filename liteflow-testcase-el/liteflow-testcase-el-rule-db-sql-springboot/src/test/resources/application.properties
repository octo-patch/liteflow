# H2 内存库：DataSourceAutoConfiguration 据此产生容器 DataSource（HikariCP），
# SqlConnectionManager 因 rule-db.url 为空，会自动复用该 DataSource bean。
spring.datasource.url=jdbc:h2:mem:ruledb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.application.name=ruledb-sql-it

# Rule-DB 模式通过 starter 绑定的 liteflow.rule-db.* 激活（计划 3 完成）。
# properties 由 Boot2/3 starter 的 LiteflowProperty(@ConfigurationProperties(prefix="liteflow"))
# + @NestedConfigurationProperty ruleDb 绑定，再经 LiteflowPropertyAutoConfiguration
# 注入 LiteflowConfig.ruleDb，最终在 FlowExecutor.init 时生效。
liteflow.rule-db.enabled=true
# application-name 不显式配置：验证 starter 默认取 spring.application.name（=ruledb-sql-it）
# H2 启动期自动建 lf_chain / lf_script / lf_change_log 三张表
liteflow.rule-db.sql.auto-init-table=true
liteflow.rule-db.sync.poll-seconds=1
liteflow.rule-db.sync.reconcile-seconds=60
